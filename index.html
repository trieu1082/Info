<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trieu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      max-width: 100vw;
      overflow-x: hidden;
      position: relative;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #05030f;
      color: #ece9fb;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px 96px;
    }

    @property --ring-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    .entry-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(5, 3, 15, 0.94);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .entry-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .entry-star-icon {
      width: 26px;
      height: 26px;
      color: #c4b5fd;
      animation: spinStar 4s linear infinite;
    }

    .entry-text {
      font-size: 15px;
      font-weight: 700;
      color: #ece9fb;
      letter-spacing: 0.5px;
      text-shadow: 0 0 14px rgba(196, 181, 253, 0.7);
      animation: pulseText 1.8s ease-in-out infinite;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    video::-webkit-media-controls,
    video::-webkit-media-controls-start-playback-button,
    video::-webkit-media-controls-play-button,
    video::-webkit-media-controls-panel {
      display: none !important;
      -webkit-appearance: none !important;
      opacity: 0 !important;
    }

    .bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: 0;
      transform: translate(-50%, -50%);
      object-fit: cover;
      pointer-events: none;
      opacity: 1;
    }

    .video-overlay {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 15%, rgba(124, 58, 237, 0.22) 0%, transparent 60%),
        radial-gradient(ellipse 70% 55% at 85% 25%, rgba(56, 189, 248, 0.16) 0%, transparent 60%),
        radial-gradient(ellipse 90% 70% at 50% 95%, rgba(236, 72, 153, 0.16) 0%, transparent 65%),
        linear-gradient(180deg, rgba(5, 3, 15, 0.45) 0%, rgba(5, 3, 15, 0.18) 45%, rgba(5, 3, 15, 0.55) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .nebula {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.55;
      will-change: transform;
    }

    .nebula-1 {
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.5) 0%, rgba(139, 92, 246, 0.12) 45%, transparent 70%);
      top: -80px;
      left: -100px;
      animation: drift1 24s ease-in-out infinite alternate;
    }

    .nebula-2 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.36) 0%, rgba(56, 189, 248, 0.1) 45%, transparent 70%);
      bottom: -60px;
      right: -90px;
      animation: drift2 28s ease-in-out infinite alternate;
    }

    .nebula-3 {
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.28) 0%, rgba(236, 72, 153, 0.08) 45%, transparent 70%);
      top: 40%;
      right: -110px;
      animation: drift3 32s ease-in-out infinite alternate;
    }

    @keyframes drift1 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(70px, 50px, 0) scale(1.15); }
    }

    @keyframes drift2 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(-60px, -50px, 0) scale(1.1); }
    }

    @keyframes drift3 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(-50px, 60px, 0) scale(1.2); }
    }

    #star-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .main-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      perspective: 1700px;
    }

    .gun-card {
      background: rgba(16, 12, 38, 0.55);
      border: 1px solid rgba(200, 190, 255, 0.16);
      border-radius: 32px;
      padding: 28px 24px;
      box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.75),
        inset 0 1px 0 rgba(220, 210, 255, 0.12);
      position: relative;
      will-change: transform;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .glow-behind {
      position: absolute;
      inset: -14px;
      border-radius: 44px;
      background: radial-gradient(ellipse at 50% 60%,
        rgba(139, 92, 246, 0.4) 0%,
        rgba(236, 72, 153, 0.14) 42%,
        rgba(56, 189, 248, 0.1) 60%,
        transparent 78%);
      transform: translateZ(-55px) scale(1.08);
      pointer-events: none;
      will-change: opacity;
      animation: glowBreathe 4.5s ease-in-out infinite;
    }

    @keyframes glowBreathe {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.95; }
    }

    .card-shine {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      overflow: hidden;
      pointer-events: none;
    }

    .card-shine::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(220, 210, 255, 0.14), transparent);
      transition: 0.5s;
    }

    .gun-card:hover .card-shine::before {
      left: 100%;
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transform-style: preserve-3d;
    }

    .avatar-wrapper {
      position: relative;
      width: 116px;
      height: 116px;
      margin-bottom: 18px;
      transform: translateZ(50px);
      will-change: transform;
    }

    .avatar-glow-behind {
      position: absolute;
      inset: -18px;
      border-radius: 50px;
      background: radial-gradient(circle,
        rgba(255, 255, 255, 0.26) 0%,
        rgba(139, 92, 246, 0.38) 36%,
        rgba(236, 72, 153, 0.16) 56%,
        transparent 74%);
      transform: translateZ(-30px);
      will-change: opacity;
      animation: glowBreathe 3.5s ease-in-out infinite;
      pointer-events: none;
    }

    .avatar-ring {
      position: absolute;
      inset: -5px;
      border-radius: 40px;
      background: conic-gradient(from var(--ring-angle), #ffffff, rgba(255, 255, 255, 0.08) 25%, #ffffff 50%, rgba(255, 255, 255, 0.08) 75%, #ffffff);
      animation: ringSpin 5s linear infinite;
      box-shadow:
        0 0 14px rgba(255, 255, 255, 0.5),
        0 0 36px rgba(139, 92, 246, 0.45);
    }

    @keyframes ringSpin {
      to { --ring-angle: 360deg; }
    }

    .avatar-img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 36px;
      border: 3px solid #0d0a20;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.7);
      background-color: #171233;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 16px rgba(139, 92, 246, 0.65);
      transform: translateZ(32px);
    }

    .verified-icon {
      width: 20px;
      height: 20px;
      color: #7dd3fc;
    }

    .profile-tag {
      font-size: 13px;
      font-weight: 700;
      color: #ddd6fe;
      background: rgba(139, 92, 246, 0.14);
      padding: 4px 14px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      border: 1px solid rgba(196, 181, 253, 0.25);
      transform: translateZ(26px);
    }

    .typewriter-text {
      font-size: 15px;
      font-weight: 800;
      min-height: 22px;
      margin-bottom: 16px;
      line-height: 1.5;
      transform: translateZ(22px);
      letter-spacing: 0.3px;
    }

    .tw-words {
      background: linear-gradient(90deg, #c4b5fd, #7dd3fc, #f0abfc);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      text-shadow: 0 0 14px rgba(167, 139, 250, 0.5);
    }

    .tw-caret {
      display: inline-block;
      width: 2px;
      height: 15px;
      margin-left: 2px;
      vertical-align: -2px;
      background: #c4b5fd;
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(196, 181, 253, 0.9);
      animation: caretBlink 0.9s ease-in-out infinite;
    }

    @keyframes caretBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }

    .stats-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding-top: 16px;
      border-top: 1px solid rgba(200, 190, 255, 0.14);
      transform: translateZ(20px);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      color: #ddd6fe;
      background: rgba(139, 92, 246, 0.12);
      padding: 6px 14px;
      border-radius: 14px;
      border: 1px solid rgba(196, 181, 253, 0.2);
    }

    .stat-icon {
      width: 14px;
      height: 14px;
      color: #c4b5fd;
    }

    .music-player-card {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      width: min(420px, calc(100vw - 28px));
      background: rgba(10, 7, 26, 0.78);
      border-radius: 20px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(200, 190, 255, 0.22);
      box-shadow: 0 14px 30px -8px rgba(0, 0, 0, 0.75), 0 0 24px rgba(139, 92, 246, 0.25);
    }

    .music-disc {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #1e1b4b, #4c1d95, #1e1b4b, #312e81, #1e1b4b);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c4b5fd;
      flex-shrink: 0;
      border: 1px solid rgba(196, 181, 253, 0.35);
      animation: spinDisc 8s linear infinite;
      animation-play-state: paused;
      will-change: transform;
    }

    .music-disc.playing {
      animation-play-state: running;
    }

    @keyframes spinDisc {
      100% { transform: rotate(360deg); }
    }

    .music-info {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .music-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-artist {
      font-size: 11px;
      color: #9d96c8;
      font-weight: 600;
    }

    .music-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .music-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #d946ef);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.2s ease;
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.55);
    }

    .music-btn:active {
      transform: scale(0.9);
    }

    .audio-visualizer {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      padding: 0 4px;
    }

    .v-bar {
      width: 3px;
      background: #c4b5fd;
      border-radius: 2px;
      height: 4px;
    }

    .playing .v-bar:nth-child(1) { animation: barPulse 0.6s ease-in-out infinite alternate; }
    .playing .v-bar:nth-child(2) { animation: barPulse 0.8s ease-in-out infinite alternate 0.2s; }
    .playing .v-bar:nth-child(3) { animation: barPulse 0.5s ease-in-out infinite alternate 0.4s; }
    .playing .v-bar:nth-child(4) { animation: barPulse 0.7s ease-in-out infinite alternate 0.1s; }

    @keyframes barPulse {
      0% { height: 3px; }
      100% { height: 14px; }
    }

    .links-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      transform-style: preserve-3d;
    }

    .link-card {
      background: rgba(16, 12, 38, 0.55);
      border: 1px solid rgba(200, 190, 255, 0.16);
      border-radius: 20px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: #ffffff;
      box-shadow:
        0 18px 35px -10px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(220, 210, 255, 0.1);
      will-change: transform;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      position: relative;
    }

    .glow-behind-sm {
      position: absolute;
      inset: -10px;
      border-radius: 28px;
      transform: translateZ(-45px) scale(1.06);
      pointer-events: none;
      will-change: opacity;
      animation: glowBreathe 4.5s ease-in-out infinite;
    }

    .glow-tiktok {
      background: radial-gradient(ellipse at 50% 60%, rgba(56, 189, 248, 0.34) 0%, rgba(236, 72, 153, 0.14) 48%, transparent 74%);
    }

    .glow-discord {
      background: radial-gradient(ellipse at 50% 60%, rgba(88, 101, 242, 0.42) 0%, rgba(139, 92, 246, 0.16) 48%, transparent 74%);
    }

    .glow-facebook {
      background: radial-gradient(ellipse at 50% 60%, rgba(59, 130, 246, 0.4) 0%, rgba(125, 211, 252, 0.14) 48%, transparent 74%);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
      transform: translateZ(26px);
    }

    .link-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
      flex-shrink: 0;
      border: 1px solid rgba(200, 190, 255, 0.15);
    }

    .icon-tiktok {
      background: #000000;
      color: #ffffff;
    }

    .icon-discord {
      background: #5865F2;
      color: #ffffff;
    }

    .icon-facebook {
      background: #1877F2;
      color: #ffffff;
    }

    .link-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .link-title {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .link-sub {
      font-size: 12px;
      font-weight: 600;
      color: #9d96c8;
    }

    .link-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      transform: translateZ(22px);
    }

    .action-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(196, 181, 253, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ddd6fe;
      cursor: pointer;
    }

    .arrow-icon {
      width: 16px;
      height: 16px;
      color: #9d96c8;
    }

    .footer-text {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #cfc8f0;
      text-shadow: 0 1px 10px rgba(139, 92, 246, 0.5);
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .star-sparkle {
      width: 14px;
      height: 14px;
      color: #c4b5fd;
      animation: spinStar 4s linear infinite;
    }

    @keyframes spinStar {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.2); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(13, 10, 32, 0.95);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(196, 181, 253, 0.4);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 999;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .click-star {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      animation: explodeStar 0.8s ease-out forwards;
    }

    @keyframes explodeStar {
      0% {
        transform: translate(-50%, -50%) scale(0) rotate(0deg);
        opacity: 1;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.5) rotate(180deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div id="entry-overlay" class="entry-overlay">
    <svg class="entry-star-icon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 0L14.59 8.41L23 11L14.59 13.59L12 22L9.41 13.59L1 11L9.41 8.41L12 0Z"/>

    <span class="entry-text">Click anywhere to enter...</span>
  </div>

  <audio id="bg-audio" loop preload="auto" src="snaptik.vn_7679666520871472405.mp3">
    <source src="snaptik.vn_7679666520871472405.mp3" type="audio/mpeg">
    <source src="https://files.catbox.moe/ng6shs.mp3" type="audio/mpeg">

  <video id="bg-video" class="bg-video" autoplay loop muted playsinline webkit-playsinline preload="auto" disablepictureinpicture disableremoteplayback src="snaptik.vn_7607607974311333142.mp4">
    <source src="snaptik.vn_7607607974311333142.mp4" type="video/mp4">
    <source src="https://files.catbox.moe/eidzkj.mp4" type="video/mp4">

  <div class="video-overlay"></div>

  <div class="nebula nebula-1"></div>

  <canvas id="star-canvas"></canvas>

  <div class="main-container">
    <div class="gun-card" data-depth="1">

      <div class="card-shine"></div>
      <div class="profile-header">

          <div class="avatar-ring"></div>
          <img class="avatar-img" src="https://i.ibb.co/jkrrqVjM/IMG-8575.png" alt="Trieu Avatar" onerror="this.onerror=null; this.src='https://ibb.co/60WWGvqP';">
        </div>

        <h1 class="profile-name">
          Trieu
          <svg class="verified-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.79-4-4-4-.495 0-.965.084-1.4.238C14.55 2.475 13.18 1.6 11.6 1.6c-1.58 0-2.95.875-3.6 2.148-.435-.154-.905-.238-1.4-.238-2.21 0-4 1.79-4 4 0 .495.084.965.238 1.4C1.575 9.55.7 10.92.7 12.5c0 1.58.875 2.95 2.148 3.6-.154.435-.238.905-.238 1.4 0 2.21 1.79 4 4 4 .495 0 .965-.084 1.4-.238 1.435 1.273 2.805 2.148 4.385 2.148 1.58 0 2.95-.875 3.6-2.148.435.154.905.238 1.4.238 2.21 0 4-1.79 4-4 0-.495-.084-.965-.238-1.4 1.273-.65 2.148-2.02 2.148-3.6zm-12.71 4.29l-4.29-4.29 1.41-1.41 2.88 2.88 6.88-6.88 1.41 1.41-8.29 8.29z"/>
          </svg>
        </h1>

        <div class="profile-tag">
          <svg class="star-sparkle" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0L14.59 8.41L23 11L14.59 13.59L12 22L9.41 13.59L1 11L9.41 8.41L12 0Z"/>
          </svg>
          @trieu1082
        </div>

  <script>
    const bgVideo = document.getElementById('bg-video');
    const bgAudio = document.getElementById('bg-audio');
    const entryOverlay = document.getElementById('entry-overlay');

    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const musicDisc = document.getElementById('music-disc');
    const visualizer = document.getElementById('visualizer');

    let isAudioPlaying = false;

    function playAudio() {
      if (!bgAudio) return;
      bgAudio.play().then(() => {
        isAudioPlaying = true;
        musicDisc.classList.add('playing');
        visualizer.classList.add('playing');
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      }).catch(() => {});
    }

    function pauseAudio() {
      if (!bgAudio) return;
      bgAudio.pause();
      isAudioPlaying = false;
      musicDisc.classList.remove('playing');
      visualizer.classList.remove('playing');
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }

    function handleEnter() {
      if (bgVideo) {
        bgVideo.muted = true;
        bgVideo.play().catch(() => {});
      }
      playAudio();
      entryOverlay.classList.add('hidden');
    }

    entryOverlay.addEventListener('pointerdown', handleEnter);

    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isAudioPlaying) {
        pauseAudio();
      } else {
        playAudio();
      }
    });

    const canvas = document.getElementById('star-canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    let width, height;
    const stars = [];

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resizeCanvas() {
      width = Math.floor(window.innerWidth);
      height = Math.floor(window.innerHeight);
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function makeStar() {
      return {
        x: Math.random() * width,
        y: Math.random() * height,
        s: Math.random() * 2 + 1,
        m: Math.random() * 0.6 + 0.25,
        o: 0,
        sp: Math.random() * 0.02 + 0.005,
        ph: Math.random() * Math.PI * 2,
        c: Math.random() > 0.4 ? '#c4b5fd' : (Math.random() > 0.5 ? '#7dd3fc' : '#ffffff')
      };
    }

    for (let i = 0; i < 34; i++) {
      stars.push(makeStar());
    }

    let targetRotX = 0;
    let targetRotY = 0;
    let curRotX = 0;
    let curRotY = 0;
    let idlePhase = Math.random() * 100;

    const tiltCards = document.querySelectorAll('[data-depth]');
    const MAX_TILT = 9;

    function clampTilt(v) {
      return v > MAX_TILT ? MAX_TILT : (v < -MAX_TILT ? -MAX_TILT : v);
    }

    function tick() {
      ctx.clearRect(0, 0, width, height);
      for (let i = 0; i < stars.length; i++) {
        const st = stars[i];
        st.ph += st.sp;
        st.o = (Math.sin(st.ph) + 1) * 0.5 * st.m;
        st.y -= 0.1;
        if (st.y < -4) st.y = height + 4;
        ctx.globalAlpha = st.o;
        ctx.fillStyle = st.c;
        ctx.fillRect(st.x, st.y, st.s, st.s);
      }

      idlePhase += 0.014;
      const tx = targetRotX + Math.sin(idlePhase * 0.7) * 1.6;
      const ty = targetRotY + Math.cos(idlePhase * 0.5) * 1.9;
      const idleZ = Math.sin(idlePhase * 0.9) * 2;

      curRotX += (tx - curRotX) * 0.085;
      curRotY += (ty - curRotY) * 0.085;

      const rx = clampTilt(curRotX);
      const ry = clampTilt(curRotY);

      for (let i = 0; i < tiltCards.length; i++) {
        const depth = parseFloat(tiltCards[i].getAttribute('data-depth')) || 1;
        tiltCards[i].style.transform =
          'translateZ(' + ((depth - 1) * 30 + idleZ * depth).toFixed(1) + 'px) rotateX(' +
          (rx * depth).toFixed(2) + 'deg) rotateY(' + (ry * depth).toFixed(2) + 'deg)';
      }

      requestAnimationFrame(tick);
    }
    tick();

    window.addEventListener('pointerdown', (e) => {
      createStarBurst(e.clientX, e.clientY);
    });

    function createStarBurst(x, y) {
      const starCount = 6;
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'click-star';

        const angle = (Math.PI * 2 / starCount) * i + Math.random() * 0.5;
        const dist = Math.random() * 45 + 22;
        star.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        star.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        star.style.left = x + 'px';
        star.style.top = y + 'px';

        const size = Math.random() * 8 + 7;
        const color = ['#c4b5fd', '#7dd3fc', '#f0abfc', '#ffffff'][i % 4];

        star.innerHTML = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + color + '"><path d="M12 0L14.59 8.41L23 11L14.59 13.59L12 22L9.41 13.59L1 11L9.41 8.41L12 0Z"/></svg>';

        document.body.appendChild(star);
        setTimeout(() => star.remove(), 800);
      }
    }

    let baseBeta = null;
    let baseGamma = null;

    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', (e) => {
        if (e.beta === null || e.gamma === null) return;
        if (baseBeta === null) {
          baseBeta = e.beta;
          baseGamma = e.gamma;
        }
        let beta = e.beta - baseBeta;
        let gamma = e.gamma - baseGamma;
        beta = beta > 25 ? 25 : (beta < -25 ? -25 : beta);
        gamma = gamma > 25 ? 25 : (gamma < -25 ? -25 : gamma);
        targetRotX = -beta * 0.5;
        targetRotY = gamma * 0.5;
      }, true);
    }

    window.addEventListener('mousemove', (e) => {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      targetRotX = (e.clientY - centerY) / 26;
      targetRotY = -(e.clientX - centerX) / 26;
    });

    window.addEventListener('mouseleave', () => {
      targetRotX = 0;
      targetRotY = 0;
    });

    const phrases = [
      "Hi!",
      "My name is PMT",
      "I Have A Wish . . .",
      "MY PRIME IS COMING"
    ];
    const phraseGradients = [
      'linear-gradient(90deg, #7dd3fc, #c4b5fd)',
      'linear-gradient(90deg, #c4b5fd, #f0abfc)',
      'linear-gradient(90deg, #fbbf24, #f0abfc, #c4b5fd)',
      'linear-gradient(90deg, #f0abfc, #7dd3fc)'
    ];
    let phraseIdx = 0;
    let charIdx = 0;
    let isDeleting = false;
    const typewriterEl = document.getElementById('typewriter');
    typewriterEl.style.background = phraseGradients[0];

    function typeEffect() {
      const currentPhrase = phrases[phraseIdx];

      if (isDeleting) {
        typewriterEl.textContent = currentPhrase.substring(0, charIdx - 1);
        charIdx--;
      } else {
        typewriterEl.textContent = currentPhrase.substring(0, charIdx + 1);
        charIdx++;
      }

      let speed = isDeleting ? 26 : 55;

      if (!isDeleting && charIdx === currentPhrase.length) {
        speed = 2000;
        isDeleting = true;
      } else if (isDeleting && charIdx === 0) {
        isDeleting = false;
        phraseIdx = (phraseIdx + 1) % phrases.length;
        typewriterEl.style.background = phraseGradients[phraseIdx];
        typewriterEl.style.webkitBackgroundClip = 'text';
        typewriterEl.style.backgroundClip = 'text';
        speed = 350;
      }

      setTimeout(typeEffect, speed);
    }
    typeEffect();

    const copyBtns = document.querySelectorAll('.copy-btn');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-msg');
    let toastTimer = null;

    copyBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();

        const url = btn.getAttribute('data-url');
        navigator.clipboard.writeText(url).then(() => {
          showToast('Copy');
        }).catch(() => {
          showToast('Error!');
        });
      });
    });

    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }
  </script>
